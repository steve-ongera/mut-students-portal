{% extends 'procurement/procurement_base.html' %}
{% block title %}Edit Supplier{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'supplier_list' %}">Suppliers</a></li>
    <li class="breadcrumb-item"><a href="{% url 'supplier_detail' supplier.supplier_code %}">{{ supplier.name }}</a></li>
    <li class="breadcrumb-item active">Edit</li>
  </ol>
</nav>

<div class="card">
  <div class="card-header"><h5>Edit Supplier — {{ supplier.name }}</h5></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Supplier Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" value="{{ supplier.name }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Supplier Code</label>
          <input type="text" class="form-control" value="{{ supplier.supplier_code }}" disabled>
          <small class="text-muted">Supplier code cannot be changed.</small>
        </div>
        <div class="col-md-6">
          <label class="form-label">Contact Person <span class="text-danger">*</span></label>
          <input type="text" name="contact_person" class="form-control" value="{{ supplier.contact_person }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email <span class="text-danger">*</span></label>
          <input type="email" name="email" class="form-control" value="{{ supplier.email }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone Number <span class="text-danger">*</span></label>
          <input type="text" name="phone_number" class="form-control" value="{{ supplier.phone_number }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Alternative Phone</label>
          <input type="text" name="alternative_phone" class="form-control" value="{{ supplier.alternative_phone }}">
        </div>
        <div class="col-12">
          <label class="form-label">Address <span class="text-danger">*</span></label>
          <textarea name="address" class="form-control" rows="2" required>{{ supplier.address }}</textarea>
        </div>
        <div class="col-md-4">
          <label class="form-label">Tax PIN</label>
          <input type="text" name="tax_pin" class="form-control" value="{{ supplier.tax_pin }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Bank Name</label>
          <input type="text" name="bank_name" class="form-control" value="{{ supplier.bank_name }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Bank Account</label>
          <input type="text" name="bank_account" class="form-control" value="{{ supplier.bank_account }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Active</label>
          <div class="form-check mt-2">
            <input type="checkbox" name="is_active" class="form-check-input" id="isActive" {% if supplier.is_active %}checked{% endif %}>
            <label class="form-check-label" for="isActive">Supplier is active</label>
          </div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <a href="{% url 'supplier_detail' supplier.supplier_code %}" class="btn btn-secondary">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>

{% endblock %}
