{% extends 'procurement/procurement_base.html' %}
{% block title %}Edit Category{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'procurement_dashboard' %}">Dashboard</a></li>
    <li class="breadcrumb-item"><a href="{% url 'category_list' %}">Categories</a></li>
    <li class="breadcrumb-item active">Edit Category</li>
  </ol>
</nav>

<div class="card">
  <div class="card-header"><h5>Edit Category — {{ category.name }}</h5></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Category Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" value="{{ category.name }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Code <span class="text-danger">*</span></label>
          <input type="text" name="code" class="form-control" value="{{ category.code }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Parent Category</label>
          <select name="parent_category" class="form-select">
            <option value="">None (Top Level)</option>
            {% for cat in parent_categories %}
            <option value="{{ cat.id }}" {% if category.parent_category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="2">{{ category.description }}</textarea>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <a href="{% url 'category_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>

{% endblock %}
