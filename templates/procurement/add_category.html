{% extends 'procurement/procurement_base.html' %}
{% block title %}Add Category{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'category_list' %}">Categories</a></li>
    <li class="breadcrumb-item active">Add Category</li>
  </ol>
</nav>

<div class="card">
  <div class="card-header"><h5>Add Procurement Category</h5></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Category Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Code <span class="text-danger">*</span></label>
          <input type="text" name="code" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Parent Category (leave blank for top-level)</label>
          <select name="parent_category" class="form-select">
            <option value="">None (Top Level)</option>
            {% for cat in parent_categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="2"></textarea>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Save Category</button>
          <a href="{% url 'category_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>

{% endblock %}
