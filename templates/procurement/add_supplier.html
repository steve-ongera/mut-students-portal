{% extends 'procurement/procurement_base.html' %}
{% block title %}Add Supplier{% endblock %}
{% block content %}

<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'supplier_list' %}">Suppliers</a></li>
    <li class="breadcrumb-item active">Add Supplier</li>
  </ol>
</nav>

<div class="card">
  <div class="card-header"><h5>Add New Supplier</h5></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Supplier Name <span class="text-danger">*</span></label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Supplier Code <span class="text-danger">*</span></label>
          <input type="text" name="supplier_code" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Contact Person <span class="text-danger">*</span></label>
          <input type="text" name="contact_person" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email <span class="text-danger">*</span></label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone Number <span class="text-danger">*</span></label>
          <input type="text" name="phone_number" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Alternative Phone</label>
          <input type="text" name="alternative_phone" class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label">Address <span class="text-danger">*</span></label>
          <textarea name="address" class="form-control" rows="2" required></textarea>
        </div>
        <div class="col-md-4">
          <label class="form-label">Tax PIN</label>
          <input type="text" name="tax_pin" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label">Bank Name</label>
          <input type="text" name="bank_name" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label">Bank Account</label>
          <input type="text" name="bank_account" class="form-control">
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Save Supplier</button>
          <a href="{% url 'supplier_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>

{% endblock %}
