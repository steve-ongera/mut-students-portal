{% extends 'vc/vc_base.html' %}

{% block vc_content %}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="h3">Create University Announcement</h1>
            <p class="text-muted">Broadcast important messages to the university community</p>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="section-card">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Content</label>
                        <textarea name="content" class="form-control" rows="10" required></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Announcement Type</label>
                        <select name="announcement_type" class="form-select" required>
                            <option value="">Select type...</option>
                            <option value="general">General</option>
                            <option value="academic">Academic</option>
                            <option value="event">Event</option>
                            <option value="urgent">Urgent</option>
                            <option value="deadline">Deadline</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Target Audience</label>
                        <select name="target_audience" class="form-select" required>
                            <option value="">Select audience...</option>
                            <option value="all">All Users</option>
                            <option value="students">All Students</option>
                            <option value="lecturers">All Lecturers</option>
                            <option value="staff">All Staff</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-check">
                            <input type="checkbox" name="is_pinned" class="form-check-input" id="isPinned">
                            <label class="form-check-label" for="isPinned">
                                Pin this announcement (appears at top)
                            </label>
                        </div>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="ri-send-plane-line me-2"></i>Publish Announcement
                        </button>
                        <a href="{% url 'vc_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
