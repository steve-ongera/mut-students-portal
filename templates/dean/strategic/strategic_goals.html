<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Goals - Dean Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../static/css/dean.css">
</head>
<body>
    <!-- Navigation will be included via template inheritance -->
    
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar will be included -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Strategic Goals</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <!-- Page-specific actions will go here -->
                    </div>
                </div>
                
                <!-- Page content will go here -->
                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i> 
                    Strategic Goals page is under development. Content will be loaded dynamically.
                </div>
                
                <!-- Placeholder for dynamic content -->
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">Strategic Planning</h5>
                            </div>
                            <div class="card-body">
                                <p class="card-text">
                                    This page will display Strategic Goals information.
                                    Data will be populated from the Django backend.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../../static/js/dean.js"></script>
</body>
</html>
